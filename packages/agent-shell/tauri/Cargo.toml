[package]
name = "steerable-agent-shell-tauri"
version = "0.1.0"
description = "Reusable Tauri desktop host for @steerable/agent-shell"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "steerable_agent_shell_tauri"

[dependencies]
arboard = "3.6.1"
base64 = "0.22"
command-group = "5.0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tokio = { version = "1", features = ["time"] }
url = "2"
