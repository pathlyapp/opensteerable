name: Remove exposed npm versions

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DELETE-0.6.39 to remove the fixed exposed versions."
        required: true
        type: string

permissions:
  contents: read

jobs:
  remove:
    if: github.repository == 'pathlyapp/opensteerable'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Delete exposed versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$CONFIRM" = "DELETE-0.6.39" || {
            echo "::error::confirmation mismatch"
            exit 1
          }
          test -n "$NODE_AUTH_TOKEN" || {
            echo "::error::NPM_TOKEN is unset"
            exit 1
          }
          npm unpublish '@steerable/agent-shell@0.6.39' --force
          npm unpublish '@steerable/agent-shell-web@0.6.39' --force
          npm unpublish '@steerable/agent-ui@0.6.39' --force
