[project]
name = "steerable-plugin-sdk"
version = "0.6.45"
description = "Pure-Python authoring and RPC SDK for Steerable tool plugins"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "steerable-agent-harness>=0.1.0,<1.0.0",
  "steerable-agent-protocol>=0.1.0,<1.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
steerable-agent-harness = { workspace = true }
steerable-agent-protocol = { workspace = true }
